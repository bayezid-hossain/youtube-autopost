name: autopost

on:
  schedule:
    # GitHub cron is UTC. This is 06:07 in Asia/Dhaka (UTC+6); a non-zero minute avoids GitHub's top-of-hour load delays.
    # For another timezone: 06:07 local converted to UTC, as "MINUTE HOUR * * *".
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, upload nothing"
        type: boolean
        default: false

permissions:
  contents: write   # commit posted_log.json back

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run autopost
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m autopost ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit ledger
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_log.json QUEUE.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update posted log and queue [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push posted_log.json and QUEUE.md"; exit 1
